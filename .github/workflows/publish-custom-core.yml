name: Publish Stripped Down BlueOS Core

on:
  push:
    tags:
      - Stripped-V*

permissions:
  contents: read

concurrency:
  group: publish-stripped-down-blueos-core
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish Core
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/blueos-core
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/arm/v7,linux/arm64/v8 \
            --build-arg GIT_DESCRIBE_TAGS="$(git describe --tags --long --always)" \
            --build-arg VITE_APP_GIT_DESCRIBE="$(git describe --long --always --dirty --all)" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --file core/Dockerfile \
            --provenance=false \
            --push \
            core

          docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}"
